server {
    listen 80;
    server_name weatheragent.link www.weatheragent.link;

    root /var/www/weatheragent-link/public;
    index index.php;

    charset utf-8;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive directories
    location ~ ^/(storage|vendor|bootstrap|src|config) {
        deny all;
    }

    # Route all requests through index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM configuration
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 30;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    # Logging
    access_log /var/log/nginx/weatheragent-access.log;
    error_log /var/log/nginx/weatheragent-error.log;

    # Disable directory listing
    autoindex off;

    # Limit request body size
    client_max_body_size 64k;
}
