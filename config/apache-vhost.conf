<VirtualHost *:80>
    ServerName weatheragent.link
    ServerAlias www.weatheragent.link

    DocumentRoot /var/www/weatheragent-link/public

    <Directory /var/www/weatheragent-link/public>
        AllowOverride All
        Require all granted

        Options -Indexes +FollowSymLinks

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [QSA,L]
    </Directory>

    <Directory /var/www/weatheragent-link>
        Options -Indexes
    </Directory>

    # Deny access to sensitive files
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    <LocationMatch "^/(storage|vendor|bootstrap|src|config)">
        Require all denied
    </LocationMatch>

    ErrorLog ${APACHE_LOG_DIR}/weatheragent-error.log
    CustomLog ${APACHE_LOG_DIR}/weatheragent-access.log combined

    # Security headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</VirtualHost>
